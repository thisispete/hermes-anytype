[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-anytype"
version = "0.1.0"
description = "Hermes plugin: chat presence and object/schema tools for a self-hosted Anytype space"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
include = ["hermes_anytype*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
