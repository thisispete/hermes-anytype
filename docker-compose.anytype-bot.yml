# Runs Hermes's own Anytype identity as a headless anytype-cli node.
#
# Confirmed against anyproto/any-sync-dockercompose's own (optional,
# commented-out) anytype-cli service block -- same official image, same
# bootstrap-then-serve pattern. See docs/design.md Section 10.
#
# This file is for the DEFAULT ANYTYPE NETWORK case (no self-hosted sync
# backend). If you're self-hosting your own any-sync backend instead, don't
# use this file -- uncomment the anytype-cli block already present in your
# any-sync-dockercompose checkout's docker-compose.yml so the bot shares
# your network.yml and actually lands on your network.
#
# Usage:
#   docker compose -f docker-compose.anytype-bot.yml up -d
#
#   # Back up the account recovery key immediately, then delete it from the
#   # container -- it's the ONLY way to recover this identity, and it's
#   # deliberately NOT in `docker logs` (see the bootstrap command's comment
#   # below for why that matters):
#   docker compose -f docker-compose.anytype-bot.yml exec anytype-cli cat /root/.anytype/ACCOUNT_RECOVERY_KEY.txt
#   # copy that into a password manager, then:
#   docker compose -f docker-compose.anytype-bot.yml exec anytype-cli rm /root/.anytype/ACCOUNT_RECOVERY_KEY.txt
#
#   docker compose -f docker-compose.anytype-bot.yml exec anytype-cli anytype auth apikey create hermes-integration
#   # from your desktop app: Share Space -> copy invite link
#   docker compose -f docker-compose.anytype-bot.yml exec anytype-cli anytype space join "<invite-link>"
#   # then approve the join request in-app -- see docs/design.md Section 10

services:
  anytype-cli-bootstrap:
    image: "ghcr.io/anyproto/anytype-cli:${ANYTYPE_CLI_VERSION:-latest}"
    restart: "no"
    volumes:
      - anytype-cli-data:/root/.anytype
    environment:
      - ANYTYPE_CLI_ACCOUNT_NAME=${ANYTYPE_CLI_ACCOUNT_NAME:-hermes}
    # `anytype` is the image's own ENTRYPOINT, already on PATH via
    # /usr/local/bin -- NOT /app/anytype (/app is just the image's empty
    # WorkingDir, confirmed by inspecting the actual image; a beta tester
    # hit this exact wrong-path bug on a real install attempt).
    #
    # entrypoint/command are deliberately split into list form (rather than
    # one `entrypoint: /bin/sh -c "..."` scalar) so the script below is
    # passed to the shell as a single literal argv element -- no risk of a
    # second, ambiguous round of shell-style tokenizing on top of Compose's
    # own `${...}` interpolation, which a plain scalar form would require
    # and which isn't practical to verify without a real `docker compose
    # config` run. `$$` below is still Compose's own interpolation escape
    # (needed regardless of this form) -- not shell escaping.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /root/.anytype/config.json ]; then
          echo 'Creating bot account...'
          anytype serve &
          SERVER_PID=$$!
          sleep 2
          # `auth create`'s own stdout/stderr is redirected to a file on the
          # persistent volume instead of this container's stdout -- a beta
          # tester found it prints the account's recovery key in plaintext,
          # and letting that hit `docker logs` puts a wallet-seed-phrase
          # -equivalent secret somewhere far more widely readable and
          # longer-lived than intended (log aggregators, anyone with
          # `docker logs` access, accidentally pasted into a chat/ticket
          # while debugging -- which is exactly what happened during beta
          # testing). Only a non-secret status line below goes to stdout.
          anytype auth create "$$ANYTYPE_CLI_ACCOUNT_NAME" > /root/.anytype/ACCOUNT_RECOVERY_KEY.txt 2>&1
          CREATE_STATUS=$$?
          chmod 600 /root/.anytype/ACCOUNT_RECOVERY_KEY.txt 2>/dev/null || true
          sleep 2
          kill $$SERVER_PID 2>/dev/null || true
          wait $$SERVER_PID 2>/dev/null || true
          if [ $$CREATE_STATUS -ne 0 ]; then
            echo 'Bot account creation failed -- see /root/.anytype/ACCOUNT_RECOVERY_KEY.txt in the volume for the command output' >&2
            exit 1
          fi
          echo "Bot account created. Its recovery key -- the ONLY way to restore this identity -- was written to /root/.anytype/ACCOUNT_RECOVERY_KEY.txt in the anytype-cli-data volume, NOT printed here. Copy it to a password manager now, then delete that file (see this file's header comment for the exact commands). Do not leave it sitting in the volume."
        else
          echo 'Bot account already exists, skipping bootstrap'
        fi
    # `auth create`'s exit status is deliberately checked and NOT swallowed
    # -- a real failure here must fail the bootstrap container, so
    # `anytype-cli`'s `depends_on: condition: service_completed_successfully`
    # actually blocks it from starting. Without this, a beta tester found the
    # main container came up "healthy" (healthcheck only checked the port was
    # open) with a permanently empty account and no visible error short of
    # `docker logs`.

  anytype-cli:
    image: "ghcr.io/anyproto/anytype-cli:${ANYTYPE_CLI_VERSION:-latest}"
    restart: unless-stopped
    depends_on:
      anytype-cli-bootstrap:
        condition: service_completed_successfully
    ports:
      # Only the REST API needs publishing -- this plugin never speaks
      # anytype-cli's gRPC ports (31010/31011).
      - "127.0.0.1:${ANYTYPE_CLI_API_PORT:-31012}:31012"
    volumes:
      - anytype-cli-data:/root/.anytype
    healthcheck:
      # Checks for an actual account, not just an open port -- "port open"
      # was true even with a permanently empty account (see the bootstrap
      # command's comment above), which is exactly what let that bug hide
      # behind a "healthy" container status.
      test: ["CMD-SHELL", "test -f /root/.anytype/config.json && nc -z 127.0.0.1 31010 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  # Holds the "hermes" account's keys -- this is the identity data
  # docs/design.md Section 10 warns needs backing up. Losing this volume
  # without a backup loses the account. The recovery key itself (see the
  # bootstrap command above) also lands here transiently -- back it up and
  # delete it; don't treat this volume as its permanent home.
  anytype-cli-data:
